services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queue
      POSTGRES_USER: queue
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: postgres
      DB_NAME: queue
      DB_USER: queue
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: python -m worker.worker
    environment:
      DB_HOST: postgres
      DB_NAME: queue
      DB_USER: queue
      DB_PASSWORD_FILE: /run/secrets/db_password
      JOB_TIMEOUT_SECONDS: 60
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:

secrets:
  db_password:
    file: ./.secrets/db_password
